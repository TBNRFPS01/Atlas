[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agent"
version = "1.0.0"
description = "ATLAS local-first desktop AI agent runtime"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
atlas = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
  "core",
  "planner",
  "tools",
  "skills",
  "memory",
  "automation",
  "vision",
  "voice",
  "interface",
  "config",
  "plugins",
  "services",
  "utils",
]
